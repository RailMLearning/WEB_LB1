<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../icons/favicon.ico">
    <link rel="stylesheet" href="../styles/style.css">
    <title>Управление студентами</title>
</head>
<body>
<main>
    <section class="wrapper wrapper-table" id="student-list">
        <h1>Управление студентами</h1>
        <p id="table-status" role="status">Загрузка…</p>
        <div class="table-scroll-container">
            <table class="table-students" id="table-students">
                <thead><tr><th scope="col">Действия</th><th scope="col">ФИО</th><th scope="col">Группа</th><th scope="col">ИСУ ID</th><th scope="col">Общежитие</th><th scope="col">Комната</th></tr></thead>
                <tbody id="students-tbody"></tbody>
            </table>
        </div>
        <div class="table-actions"><button type="button" class="btn btn-add" id="btn-add">Добавить</button></div>
    </section>
    <div class="modal" id="form-modal" role="dialog" aria-modal="true" aria-labelledby="form-title" aria-hidden="true" inert>
        <div class="wrapper wrapper-form">
            <h2 id="form-title">Добавление студента</h2>
            <form class="form-container" id="studform">
                <label for="student-isu">ИСУ ID</label>
                <input id="student-isu" name="isu" type="text" inputmode="numeric" pattern="[0-9]{5,7}" minlength="5" maxlength="7" class="form-input" required>
                <label for="student-fio">ФИО</label>
                <input id="student-fio" name="fio" type="text" maxlength="150" class="form-input" required>
                <label for="student-group">Группа</label>
                <input id="student-group" name="grid" type="text" minlength="2" maxlength="20" class="form-input" required>
                <label for="student-dorm">Номер общежития</label>
                <input id="student-dorm" name="dnum" type="number" min="1" step="1" class="form-input" required>
                <label for="student-room">Комната</label>
                <input id="student-room" name="rnum" type="number" min="1" step="1" class="form-input" required>
                <label for="student-expdate">Срок заселения (дата)</label>
                <input id="student-expdate" name="expdate" type="date" min="0001-01-01" max="9999-12-31" class="form-input" required>
                <label class="checkbox-label"><input name="foreigner" type="checkbox"><span>Иностранец</span></label>
                <label for="student-notes">Заметки (необязательно)</label>
                <textarea id="student-notes" name="notes" maxlength="500" rows="3" class="form-input"></textarea>
                <p id="error" role="alert"></p>
                <button type="submit" class="form-button" id="submit">Сохранить</button>
                <button type="button" class="form-button" data-close="form-modal">Закрыть</button>
            </form>
        </div>
    </div>
    <div class="modal" id="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="delete-title" aria-hidden="true" inert>
        <div class="wrapper wrapper-window">
            <h2 id="delete-title">Удаление студента</h2>
            <p id="delete-description"></p>
            <p id="delete-error" role="alert"></p>
            <div class="keyboard">
                <button type="button" class="btn" data-close="confirm-modal">Отмена</button>
                <button type="button" class="btn btn-danger" id="confirm-delete">Удалить</button>
            </div>
        </div>
    </div>
    <div class="modal" id="more-info-modal" role="dialog" aria-modal="true" aria-labelledby="details-title" aria-hidden="true" inert>
        <div class="wrapper wrapper-window">
            <h2 id="details-title">Досье студента</h2>
            <p id="student-details-status" role="status"></p>
            <table class="table-students table-minimized student-details-table" aria-label="Досье студента"><tbody id="more-info"></tbody></table>
            <div class="ok-container"><button type="button" class="btn btn-add" data-close="more-info-modal">Закрыть</button></div>
        </div>
    </div>
</main>
<script src="../scripts/modal.js"></script>
<script src="../scripts/validation.js"></script>
<script src="../scripts/cookies.js"></script>
<script src="../scripts/studentDetails.js"></script>
<script src="../scripts/utils.js"></script>
<script src="../scripts/eventHandlers.js"></script>
<script src="../scripts/onload.js"></script>
</body>
</html>
