<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../icons/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" sizes="180x180" href="../icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../icons/favicon-16x16.png">
    <link rel="manifest" href="../icons/site.webmanifest">
    <link rel="stylesheet" href="../styles/style.css">
    <title>Управление студентами</title>
</head>

<body>
    <main>

        <!-- Модальное окно -->
        <div class="modal" id="form-modal">
            <div class="wrapper form">
                <form class="form-container">
                    <input type="text" placeholder="Номер ИСУ" class="form-input">
                    <input type="text" placeholder="ФИО" class="form-input">
                    <input type="text" placeholder="Группа" class="form-input">
                    <input type="number" placeholder="Номер общежития" class="form-input">
                    <input type="number" placeholder="Комната" class="form-input">
                    <input type="number" placeholder="Срок заселения (лет)" class="form-input">

                    <label class="checkbox-label">
                        <input type="checkbox">
                        <span>Иностранец</span>
                    </label>

                    <input type="text" placeholder="Заметки" class="form-input">
                    <button type="submit" class="form-button">Сохранить</button>
                    <button type="button" class="form-button" onclick="closeModal('form-modal')">Закрыть</button>
                </form>
            </div>
        </div>

        <div class="modal" id="confirm-modal">
            <div class="wrapper confirm">
                <h1> Подтвердить действие? </h1>
                <p> Это нельзя будет отменить</p>
                <div class="keyboard">
                    <button id="ok" onclick="closeModal('confirm-modal')">Нет, не надо</button>
                    <button id="cancel" onclick="closeModal('confirm-modal')">Да, без Б</button>
                </div>
            </div>
        </div>

        <!-- Контейнер таблицы -->
        <div class="wrapper table">
            <table class="table-students" id="table-students">
                <thead>
                    <tr>
                        <th>Действия</th>
                        <th>ФИО</th>
                        <th>ИСУ ID</th>
                        <th>Номер общежития</th>
                        <th>Комната</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="panel">
                            <button type="button" class="btn btn-edit" id="edit-123456" onclick="openModal('form-modal')">Изменить</button>
                            <button type="button" class="btn btn-delete" id="delete-123456" onclick="openModal('confirm-modal')">Удалить</button>
                            <button type="button" class="btn btn-more" id="more-123456">Подробнее...</button>
                        </td>
                        <td>Иванов И.И.</td>
                        <td>123456</td>
                        <td>3</td>
                        <td>402</td>
                    </tr>
                </tbody>
            </table>
            
            <div class="table-actions">
                <button type="button" class="btn btn-add" id="btn-add" onclick="openModal('form-modal')">Добавить</button>
            </div>
        </div>

    </main>

    <script src="../scripts/modal.js" type="text/javascript"></script>
    <script src="../scripts/eventHandlers.js" type="text/javascript"></script>
</body>

</html>
