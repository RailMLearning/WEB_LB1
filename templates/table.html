<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../icons/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" sizes="180x180" href="../icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../icons/favicon-16x16.png">
    <link rel="manifest" href="../icons/site.webmanifest">
    <link rel="stylesheet" href="../styles/style.css">
    <title>Управление студентами</title>
</head>

<body>
    <main>

        <!-- Модальное окно формы -->
        <div class="modal" id="form-modal">
            <div class="wrapper wrapper-form">
                <form class="form-container">
                    <input name="id" type="text" placeholder="Номер ИСУ" class="form-input" required>
                    <input name="fio" type="text" placeholder="ФИО" class="form-input" required>
                    <input name="grid" type="text" placeholder="Группа" class="form-input" required>
                    <input name="dnum" type="number" placeholder="Номер общежития" class="form-input" required>
                    <input name="rnum" type="number" placeholder="Комната" class="form-input" required>
                    <input name="expdate" type="date" placeholder="Срок заселения (лет)" class="form-input" required>

                    <label class="checkbox-label">
                        <input name="foreign" type="checkbox" required>
                        <span>Иностранец</span>
                    </label>

                    <input name="notes" type="text" placeholder="Заметки" class="form-input">
                    <button type="submit" class="form-button" onclick="closeModal('form-modal')" id="submit">Сохранить</button>
                    <button type="button" class="form-button btn-secondary" onclick="closeModal('form-modal')">Закрыть</button>
                </form>
            </div>
        </div>

        <!-- Модальное окно подтверждения -->
        <div class="modal" id="confirm-modal">
            <div class="wrapper wrapper-window">
                <h2>Подтвердить действие?</h2>
                <p>Это нельзя будет отменить</p>
                <div class="keyboard">
                    <button type="button" class="btn" id="ok" onclick="closeModal('confirm-modal')">Нет, не надо</button>
                    <button type="button" class="btn btn-danger" id="cancel" onclick="closeModal('confirm-modal')">Да, без Б</button>
                </div>
            </div>
        </div>

        <!-- Модальное окно с подробной информацией -->
        <div class="modal" id="more-info-modal">
            <div class="wrapper wrapper-window">
                <h2>Подробная информация:</h2>
                <div class="table-scroll-container">
                    <table class="table-students table-minimized">
                        <thead>
                            <tr>
                                <th>ФИО</th>
                                <th>ИСУ ID</th>
                                <th>Номер общежития</th>
                                <th>Комната</th>
                                <th>Срок заселения</th>
                                <th>Иностранец</th>
                                <th>Заметки</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Иванов И.И.</td>
                                <td>123456</td>
                                <td>3</td>
                                <td>402</td>
                                <td></td>
                                <td></td>
                                <td></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="ok-container">
                    <button type="button" class="btn btn-add" id="close" onclick="closeModal('more-info-modal')">ОК</button>
                </div>
            </div>
        </div>

        <!-- Контейнер основной таблицы -->
        <div class="wrapper wrapper-table">
            <div class="table-scroll-container">
                <table class="table-students" id="table-students">
                    <thead>
                        <tr>
                            <th>Действия</th>
                            <th>ФИО</th>
                            <th>ИСУ ID</th>
                            <th>Номер общежития</th>
                            <th>Комната</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="panel">
                                <button type="button" class="btn btn-edit" id="edit-123456" onclick="openModal('form-modal')">Изменить</button>
                                <button type="button" class="btn btn-delete" id="delete-123456" onclick="openModal('confirm-modal')">Удалить</button>
                                <button type="button" class="btn btn-more" id="more-123456" onclick="openModal('more-info-modal')">Подробнее...</button>
                            </td>
                            <td>Иванов И.И.</td>
                            <td>123456</td>
                            <td>3</td>
                            <td>402</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="table-actions">
                <button type="button" class="btn btn-add" id="btn-add" onclick="openModal('form-modal')">Добавить</button>
            </div>
        </div>

    </main>

    <script src="../scripts/modal.js" type="text/javascript"></script>
    <script src="../scripts/eventHandlers.js" type="text/javascript"></script>
</body>

</html>
