services:
  migrate:
    image: flyway/flyway:latest
    command: -connectRetries=60 migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/${DB_NAME:-students}
      FLYWAY_USER: ${DB_USER:-students}
      FLYWAY_PASSWORD: ${DB_PASSWORD:?Run tools/setup-env.ps1}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_BASELINE_VERSION: "1"
    volumes:
      - ./java-backend/docker/migrations:/flyway/sql:ro
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-students}
      POSTGRES_USER: ${DB_USER:-students}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run tools/setup-env.ps1}
    volumes:
      - lab3-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-students}
      DB_USER: ${DB_USER:-students}
      DB_PASSWORD: ${DB_PASSWORD:?Run tools/setup-env.ps1}
      JWT_SECRET: ${JWT_SECRET:?Run tools/setup-env.ps1}
      JWT_ISSUER: ${JWT_ISSUER:-students-lab}
      ACCESS_TOKEN_SECONDS: ${ACCESS_TOKEN_SECONDS:-900}
      REFRESH_TOKEN_SECONDS: ${REFRESH_TOKEN_SECONDS:-604800}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@students.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run tools/setup-env.ps1}
    ports:
      - "${API_PORT:-8000}:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      BACKEND_HOST: web
      BACKEND_PORT: 8080
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      web:
        condition: service_healthy
volumes:
    lab3-postgres:
